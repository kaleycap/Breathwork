<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breathwork</title>
  <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11161c" media="(prefers-color-scheme: dark)">
  <!-- Let the app open full screen when added to an iPhone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Breathwork">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Breathwork</h1>
      <p class="subtitle">Follow the circle. Breathe in as it grows, out as it shrinks.</p>
    </header>

    <section class="stage" aria-live="polite">
      <div class="ring">
        <div class="circle" id="circle"></div>
        <div class="readout">
          <div class="phase" id="phase">Ready</div>
          <div class="count" id="count"></div>
        </div>
      </div>
      <div class="stats">
        <span>Cycles <strong id="cycles">0</strong></span>
        <span>Time <strong id="elapsed">0:00</strong></span>
      </div>
    </section>

    <section class="controls">
      <label for="pattern">Pattern</label>
      <select id="pattern"></select>
      <p class="description" id="description"></p>

      <div class="timings-header">
        <span>Seconds per step</span>
        <button type="button" id="restore" class="link">Restore defaults</button>
      </div>
      <div class="timings" id="timings"></div>

      <label for="duration">Session length</label>
      <select id="duration">
        <option value="0">Until I stop</option>
        <option value="60">1 minute</option>
        <option value="180">3 minutes</option>
        <option value="300" selected>5 minutes</option>
        <option value="600">10 minutes</option>
      </select>

      <label class="toggle"><input type="checkbox" id="sound" checked> Sound cues</label>

      <div class="buttons">
        <button id="start" class="primary">Start</button>
        <button id="reset">Reset</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
